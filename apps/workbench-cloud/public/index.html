<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="__CSP__"><title>AI 專案工作台</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.mjs"></script></head><body><a class="skip" href="#main">跳至主要內容</a><header><strong>AI 專案工作台 · 雲端基礎版</strong><nav id="navigation" hidden><button id="home" type="button" class="secondary">所有專案</button><button id="new" type="button">開始新專案</button><button id="logout" type="button" class="secondary">登出</button></nav></header><main id="main"><p class="hint">AI 尚未啟用，計畫與紀錄由你手動整理。GitHub 連結僅供參考，不讀取或上傳內容。</p><p id="error" role="alert" tabindex="-1" hidden></p><p id="status" role="status" aria-live="polite"></p><button id="restore" type="button" class="secondary" hidden>恢復此帳號未保存內容</button>
<section id="login-view"><h1 tabindex="-1">登入你的工作台</h1><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required><button id="login" type="submit">登入</button></form><p>僅限管理員預先建立的帳號，此版不開放註冊。沒有帳號？請聯絡管理員。</p></section>
<section id="home-view" hidden><h1 tabindex="-1">所有專案</h1><p>保存你的想法，隨時回來完善計畫。</p><button id="reload" type="button" class="secondary">重新載入專案</button><div id="projects" class="cards"></div></section>
<section id="new-view" hidden><h1 tabindex="-1">開始新專案</h1><form id="new-form"><label for="name">專案名稱（1–100 字）</label><input id="name" required maxlength="100"><label for="summary">你的想法（1–5,000 字）</label><textarea id="summary" required maxlength="5000" placeholder="我想做什麼、希望幫誰解決什麼問題？"></textarea><p class="hint">內容保存在雲端工作台，僅你的帳號可读寫；不呼叫 AI、不建立 GitHub 專案。</p><button type="submit">建立專案</button></form></section>
<section id="project-view" hidden><h1 id="project-title" tabindex="-1">正在開啟專案…</h1><p id="project-summary"></p><form id="plan-form"><label for="plan">手動專案計畫（最多 12,000 字）</label><textarea id="plan" maxlength="12000"></textarea><button type="submit">保存計畫</button></form><form id="note-form"><label for="note">追加紀錄（1–8,000 字）</label><textarea id="note" maxlength="8000" required></textarea><button type="submit">追加紀錄</button></form><h2>已保存紀錄</h2><p class="hint">紀錄只能追加，不能修改或刪除；沒有 AI 回覆。</p><div id="notes"></div><form id="repo-form"><label for="repo">GitHub 參考連結（選填）</label><input id="repo" type="url" placeholder="https://github.com/owner/repo"><p class="hint">只保存連結，留空可清除。不讀取私人 repo、不建立 PR。</p><button type="submit">保存連結</button></form></section>
<dialog id="discard"><form method="dialog"><h2>尚有未保存內容</h2><p>離開會捨棄草稿。</p><button value="cancel" class="secondary">繼續編輯</button><button value="discard">捨棄並離開</button></form></dialog></main></body></html>
