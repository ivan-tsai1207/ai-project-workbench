<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專案首頁到成果：UX 線框</title><style>body{font:16px/1.6 system-ui;background:#fafafa;color:#222;max-width:960px;padding:24px;margin:auto}section{border:1px solid #aaa;padding:32px;margin:24px 0}button,input,textarea{font:inherit;padding:12px;margin:8px 0}input,textarea{display:block;width:95%}.row{display:flex;gap:24px}@media(max-width:700px){.row{display:block}section{padding:20px}}</style><section><h1>把想法變成第一份專案計畫</h1><p>一起釐清目標、使用者、最小功能與下一步。</p><button>開始新專案</button><button>接續 GitHub 專案</button><h2>你的專案</h2><p>沒有專案時，提示從上方開始。</p></section><section><button>回到所有專案</button><h1>說說你的想法</h1><label>專案名稱<input placeholder="我的庫存管理"></label><label>想解決什麼問題？<textarea placeholder="誰遇到什麼問題？你希望怎麼改善？"></textarea></label><p>確認後，想法會交由 OpenAI 分析；成果先保存在這台電腦，不建立 GitHub。</p><button>建立專案並整理計畫</button></section><section><button>回到所有專案</button><h1>我的專案</h1><h2>第一份專案計畫</h2><p>目標、使用者、建議最小功能、下一步、待確認問題。</p><button>分析失敗時：重新整理計畫</button><label>補充想法或回答問題<textarea></textarea></label><details><summary>對話紀錄與進階設定</summary>歷史、模型、技能</details><details><summary>保存到 GitHub</summary>先查看內容再確認上傳。</details></section></html>
